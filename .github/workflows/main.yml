name: Java CI

on:
  push:
    branches: [ "6", "1.12.2" ]  # 指定触发分支
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有历史记录用于生成更新日志

      - name: 'Setup JDK 8'
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '8'
          architecture: x64

      - name: 'Setup JDK 11'
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
          architecture: x64

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar

      - name: Cleanup Gradle Cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiLogin-Artifacts
          path: |
            bukkit/loader/build/libs/MultiLogin-*.jar
            bungee/loader/build/libs/MultiLogin-*.jar
            velocity/loader/build/libs/MultiLogin-*.jar
          retention-days: 1
          if-no-files-found: warn

      # 获取版本号
      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            # 移除v前缀（如果存在）
            VERSION=${VERSION#v}
          else
            VERSION=$(date +%Y%m%d%H%M%S)-SNAPSHOT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 生成更新日志
      - name: Generate changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        uses: metcalfc/changelog-generator@v4.1.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      # 创建Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: MultiLogin ${{ steps.get_version.outputs.version }}
          body: |
            ## 🎉 MultiLogin ${{ steps.get_version.outputs.version }}
            
            ### 📦 下载
            - **Bukkit**: [MultiLogin-Bukkit-${{ steps.get_version.outputs.version }}.jar](./bukkit/loader/build/libs/MultiLogin-${{ steps.get_version.outputs.version }}.jar)
            - **BungeeCord**: [MultiLogin-Bungee-${{ steps.get_version.outputs.version }}.jar](./bungee/loader/build/libs/MultiLogin-${{ steps.get_version.outputs.version }}.jar)
            - **Velocity**: [MultiLogin-Velocity-${{ steps.get_version.outputs.version }}.jar](./velocity/loader/build/libs/MultiLogin-${{ steps.get_version.outputs.version }}.jar)
            
            ### 📝 更新日志
            ${{ steps.changelog.outputs.changelog }}
            
            ### 🔧 安装说明
            1. 根据你的服务端类型选择对应的插件
            2. 将jar文件放入 `plugins/loader` 文件夹
            3. 重启服务器
            4. 配置文件位于 `plugins/MultiLogin` 文件夹
            
            ### ⚠️ 注意事项
            - 确保你的服务端版本兼容
            - 建议在测试环境先测试
            - 升级前请备份配置文件
            
          files: |
            bukkit/loader/build/libs/MultiLogin-*.jar
            bungee/loader/build/libs/MultiLogin-*.jar
            velocity/loader/build/libs/MultiLogin-*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

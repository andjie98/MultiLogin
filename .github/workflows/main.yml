name: Java CI

on:
  push:
    branches: [ "6", "1.12.2" ]  # 指定触发分支
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4  # 更新到v4

      - name: 'Setup JDK 8'
        uses: actions/setup-java@v4  # 使用官方的setup-java action
        with:
          distribution: 'adopt'  # 指定发行版
          java-version: '8'
          architecture: x64

      - name: 'Setup JDK 11'
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
          architecture: x64

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3  # 使用最新的gradle action

      - name: Build with Gradle
        run: ./gradlew shadowJar  # 直接运行gradle命令

      - name: Cleanup Gradle Cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties

      - name: Upload artifacts
        uses: actions/upload-artifact@v4  # 更新到v4
        with:
          name: MultiLogin-Artifacts
          path: |
            bukkit/loader/build/libs/MultiLogin-*.jar
            bungee/loader/build/libs/MultiLogin-*.jar
            velocity/loader/build/libs/MultiLogin-*.jar
          retention-days: 1  # 保留1天，如果需要更长时间可以调整
          if-no-files-found: warn  # 如果没有找到文件，发出警告而不是失败
